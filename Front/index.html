    <!-- Critical CSS — above-the-fold hero layout only.
         Keeps the hero stage sized, coloured, and legible before the main
         stylesheet link is parsed.  Under 2 KB. Full CSS is in index.css. -->
    <style>
      :root {
        --hero-ink: #0b1e33;
        --hero-ink-rgb: 11 30 51;
        --accent: #8B1E35;
        --font-display: "Outfit", system-ui, sans-serif;
        --header-h: 4rem;
        --gutter: clamp(1.25rem, 4vw, 2rem);
      }
      @media (min-width: 1024px) { :root { --header-h: 4.5rem; } }

      /* Hero stage: full-bleed dark gradient plate shown before stylesheet */
      .hero-stage {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(ellipse 90% 70% at 18% 12%, rgb(21 52 100 / 0.85), transparent 58%),
          radial-gradient(ellipse 70% 60% at 88% 8%,  rgb(139 30 53 / 0.35),  transparent 52%),
          linear-gradient(160deg, #0b1e33 0%, #153464 62%, #10305a 100%);
        background-color: var(--hero-ink);
      }

      /* Shell: sets hero minimum height so there is no layout shift when
         the real CSS arrives */
      .hero-shell {
        position: relative;
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        justify-content: flex-end;
        min-height: clamp(32rem, 88svh, 44rem);
      }
      @media (min-width: 640px)  { .hero-shell { justify-content: center; min-height: clamp(34rem, 92svh, 52rem); } }
      @media (min-width: 1024px) { .hero-shell { min-height: clamp(38rem, 94svh, 56rem); } }

      /* Hero content: padded column over the image */
      .hero-content {
        position: relative;
        z-index: 2;
        width: 100%;
        padding-left: var(--gutter);
        padding-right: var(--gutter);
        padding-top: calc(var(--header-h) + 1.1rem);
        padding-bottom: 1.15rem;
      }

      /* Hero headline */
      .hero-title {
        font-family: var(--font-display);
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.035em;
        line-height: 1.06;
        font-size: clamp(1.9rem, 1.15rem + 4.2vw, 4.15rem);
        margin-top: 1rem;
      }

      /* Hero backdrop: fills the stage so the background plate is instant */
      .hero-visual {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }
      .hero-backdrop {
        position: absolute;
        inset: 0;
      }
      .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

      /* Static navbar prerender — minimal above-the-fold critical CSS */
      .site-nav{position:fixed;top:0;left:0;right:0;z-index:50;height:var(--header-h);}
      .site-nav--over{background:transparent;}
      .site-nav--solid{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);}
      .container-pad{padding-left:var(--gutter);padding-right:var(--gutter);max-width:90rem;margin:0 auto;}
      .site-nav-brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;}
      .site-nav-logo{display:block;width:auto;border-radius:3px;object-fit:contain;}
      .site-nav-brand-text{display:flex;flex-direction:column;}
      .site-nav-brand-name{font-family:var(--font-display);font-weight:700;font-size:.9rem;color:#fff;line-height:1.1;}
      .site-nav-brand-tail{font-size:.7rem;color:rgba(255,255,255,.7);line-height:1.1;}
    </style>
